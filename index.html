<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡ salmontic's guestbook ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Trebuchet+MS&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: 'Comic Neue', 'Trebuchet MS', sans-serif;
    color: #2a0d4a;
    background: linear-gradient(135deg, #9be8ff 0%, #c9a6ff 45%, #ffb3e0 100%);
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "✦ ✧ ★ ✦ ✧ ★ ✦ ✧ ★ ✦ ✧ ★ ✦ ✧ ★ ✦ ✧ ★ ✦ ✧ ★";
    position: fixed;
    inset: 0;
    color: rgba(255,255,255,0.55);
    font-size: 22px;
    line-height: 90px;
    letter-spacing: 55px;
    word-spacing: 40px;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 18px 14px 40px; }

  .titlebar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    background: linear-gradient(#5b2fb8, #2a0d4a);
    border: 2px solid #fff;
    border-radius: 8px 8px 0 0;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .titlebar span:last-child { display: flex; gap: 4px; }
  .titlebar b {
    display: inline-block;
    width: 16px; height: 16px;
    background: linear-gradient(#fff, #ccc);
    border: 1px solid #2a0d4a;
    border-radius: 3px;
    text-align: center;
    line-height: 14px;
    color: #2a0d4a;
  }

  .panel {
    background: rgba(255,255,255,0.85);
    border: 3px solid #fff;
    border-top: 0;
    border-radius: 0 0 14px 14px;
    box-shadow: 0 8px 0 rgba(90,30,150,0.25), 0 10px 24px rgba(90,30,150,0.35);
    padding: 16px;
  }

  h1.title {
    text-align: center;
    margin: 4px 0 2px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(180deg, #fff 0%, #d9baff 45%, #a86bff 60%, #5b2fb8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 0 rgba(90,30,150,0.25);
  }
  .subtitle { text-align: center; font-size: 12px; color: #6d3fbf; margin: 0 0 14px; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .divider {
    height: 6px;
    margin: 12px 0;
    border-radius: 3px;
    background: repeating-linear-gradient(90deg, #ff8fd6 0 10px, #9be8ff 10px 20px, #ffe066 20px 30px);
  }

  label { display: block; margin-top: 10px; font-size: 12px; font-weight: 700; color: #5b2fb8; letter-spacing: 0.5px; }
  input[type="text"], textarea {
    width: 100%;
    margin-top: 4px;
    padding: 9px 10px;
    font: inherit;
    font-size: 14px;
    color: #2a0d4a;
    background: #fff;
    border: 2px solid #b98bff;
    border-radius: 10px;
    outline: none;
    box-shadow: inset 0 2px 4px rgba(90,30,150,0.12);
  }
  input[type="text"]:focus, textarea:focus { border-color: #ff5fb0; }
  textarea { min-height: 90px; resize: vertical; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .send-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    background: linear-gradient(180deg, #ff9de2 0%, #ff5fb0 45%, #c9298a 100%);
    border: 2px solid #fff;
    border-radius: 999px;
    box-shadow: 0 4px 0 #a01d69, 0 6px 10px rgba(160,29,105,0.4), inset 0 2px 3px rgba(255,255,255,0.6);
    cursor: pointer;
  }
  .send-btn:hover { filter: brightness(1.06); }
  .send-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a01d69, inset 0 2px 3px rgba(255,255,255,0.6); }
  .send-btn:disabled { opacity: 0.6; cursor: wait; }

  #status { margin: 8px 0 0; font-size: 12px; font-weight: 700; text-align: center; min-height: 1.3em; color: #5b2fb8; }
  #status.err { color: #d6006e; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid #ff5fb0; outline-offset: 2px; }

  .counter { margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #5b2fb8; }
  .counter .odometer { display: flex; gap: 2px; padding: 3px 6px; background: #000; border-radius: 4px; box-shadow: inset 0 0 4px rgba(0,255,0,0.4); }
  .counter .odometer span { display: inline-block; width: 14px; text-align: center; font-family: 'Courier New', monospace; font-weight: 700; color: #7CFC00; text-shadow: 0 0 4px #7CFC00; }

  #entries { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  #entries li { position: relative; padding: 12px 14px; background: linear-gradient(135deg, #fff 0%, #f2e8ff 100%); border: 2px solid #d9baff; border-radius: 14px; box-shadow: 0 3px 0 rgba(90,30,150,0.12); }
  #entries li.empty { text-align: center; color: #6d3fbf; font-style: italic; }
  #entries b { display: inline-block; margin-bottom: 4px; padding: 2px 10px; font-size: 13px; color: #fff; background: linear-gradient(90deg, #ff8fd6, #9b6bff); border-radius: 999px; }
  #entries p { margin: 0; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>

<div class="wrap">
  <div class="titlebar">
    <span>guestbook.exe</span>
    <span><b>_</b><b>□</b><b>×</b></span>
  </div>

  <div class="panel">
    <h1 class="title">✧ SIGN MY GUESTBOOK ✧</h1>
    <p class="subtitle">est. 2026 <span class="blink">●</span> leave ur mark below</p>

    <div class="divider"></div>

    <form id="gb-form" autocomplete="off">
      <label for="gb-name">✎ your name</label>
      <input type="text" id="gb-name" maxlength="40" placeholder="Anonymous">

      <label for="gb-message">✎ your message</label>
      <textarea id="gb-message" maxlength="500" required placeholder="say hii~"></textarea>

      <div class="hp" aria-hidden="true">
        <input type="text" id="gb-trap" name="zq_note_x" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" class="send-btn" id="gb-send">☆ SEND ☆</button>
      <p id="status" role="status"></p>
    </form>

    <div class="divider"></div>

    <div class="counter">
      you are visitor #
      <span class="odometer" id="odo"></span>
    </div>

    <ol id="entries"><li class="empty">Loading...</li></ol>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    initializeFirestore, collection, addDoc, getDocs,
    query, orderBy, limit, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyDcdDWePMokczrl7uccMp9mhc9ERDB-6oA",
    authDomain: "eo-cite.firebaseapp.com",
    projectId: "eo-cite",
    storageBucket: "eo-cite.firebasestorage.app",
    messagingSenderId: "617905820259",
    appId: "1:617905820259:web:1d16cb3796961bf03f5e56"
  });
  const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
  const col = collection(db, "guestbook");

  const $ = (id) => document.getElementById(id);

  function setStatus(msg, err = false) {
    $("status").textContent = msg;
    $("status").className = err ? "err" : "";
  }

  function withTimeout(p, ms) {
    return Promise.race([
      p,
      new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))
    ]);
  }

  // fake odometer count: real entry count + a fixed offset, purely decorative
  function renderOdometer(n) {
    const odo = $("odo");
    odo.replaceChildren();
    const digits = String(n).padStart(6, "0").split("");
    for (const d of digits) {
      const span = document.createElement("span");
      span.textContent = d;
      odo.append(span);
    }
  }

  async function load() {
    try {
      const snap = await withTimeout(
        getDocs(query(col, orderBy("createdAt", "desc"), limit(50))), 10000
      );
      const list = $("entries");
      list.replaceChildren();
      renderOdometer(1337 + snap.size);
      if (snap.empty) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "No messages yet~ be the first!";
        list.append(li);
        return;
      }
      snap.forEach((doc) => {
        const d = doc.data();
        const li = document.createElement("li");
        const b = document.createElement("b");
        b.textContent = d.name || "Anonymous";
        const p = document.createElement("p");
        p.textContent = d.message || "";
        li.append(b, p);
        list.append(li);
      });
    } catch (e) {
      console.error(e);
      renderOdometer(1337);
      $("entries").replaceChildren();
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = e.code === "timeout"
        ? "Can't reach the database right now."
        : "Couldn't load: " + (e.code || e.message);
      $("entries").append(li);
    }
  }

  $("gb-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if ($("gb-trap").value) return; // bots fill this in

    const name = $("gb-name").value.trim() || "Anonymous";
    const message = $("gb-message").value.trim();
    if (!message) { setStatus("write something first!", true); return; }

    $("gb-send").disabled = true;
    setStatus("sending...");
    try {
      await withTimeout(addDoc(col, { name, message, createdAt: serverTimestamp() }), 10000);
      $("gb-form").reset();
      setStatus("sent! thanks for stopping by ♡");
      load();
    } catch (e) {
      console.error(e);
      setStatus(e.code === "timeout" ? "can't reach the database." : "Error: " + (e.code || e.message), true);
    } finally {
      $("gb-send").disabled = false;
    }
  });

  load();
</script>

</body>
</html>
